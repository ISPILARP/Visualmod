              public static class Compass extends Module {
                  private static final String[] N = { "S", "SW", "W", "NW", "N", "NE", "E", "SE" };
                  private static final float[] A = { 0f, 45f, 90f, 135f, 180f, -135f, -90f, -45f };
                  public Compass() { super("Compass", Category.HUD); }
                  @Override public void onRender(DrawContext ctx, int w, int h) {
                      if (mc.player == null) return;
                      float yaw = mc.player.getYaw();
                      for (int i = 0; i < N.length; i++) {
                          float d = MathHelper.wrapDegrees(A[i] - yaw);
                          if (Math.abs(d) < 75f) {
                              ctx.drawCenteredTextWithShadow(mc.textRenderer, N[i], (int) (w / 2 + d * 1.6f), 16, ModuleManager.color(i));
                          }
                      }
                      ctx.fill(w / 2, 26, w / 2 + 1, 29, 0xFFFF5555);
                  }
              }

              public static class FpsGraph extends Module {
                  private final Deque<Integer> samples = new ArrayDeque<>();
                  public FpsGraph() { super("FPS Graph", Category.HUD); }
                  @Override public void onTick() {
                      samples.addLast(mc.getCurrentFps());
                      while (samples.size() > 60) samples.pollFirst();
                  }
                  @Override public void onRender(DrawContext ctx, int w, int h) {
                      if (samples.isEmpty()) return;
                      int max = 1;
                      for (int v : samples) max = Math.max(max, v);
                      int x = w - 70, y = h - 120, gh = 30, i = 0;
                      ctx.fill(x - 1, y - 1, x + 61, y + gh + 1, 0x80000000);
                      for (int v : samples) {
                          int bar = Math.max(1, v * gh / max);
                          ctx.fill(x + i, y + gh - bar, x + i + 1, y + gh, 0xFF55FF55);
                          i++;
                      }
                  }
              }

