name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Generate project
        run: |
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'fabric-loom' version '1.5-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
          java {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx1G
          minecraft_version=1.20.1
          yarn_mappings=1.20.1+build.10
          loader_version=0.15.11
          fabric_version=0.92.2+1.20.1
          mod_version=1.4.0
          maven_group=com.bob
          archives_base_name=visualmod
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  maven { url 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual
          cat > src/main/java/com/bob/visual/VisualClient.java <<'EOF_FILE'
          package com.bob.visual;

          import com.bob.visual.gui.ClickGuiScreen;
          import com.bob.visual.module.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class VisualClient implements ClientModInitializer {
              public static KeyBinding openKey;

              @Override
              public void onInitializeClient() {
                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.visual.open", InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT, "category.visual"));

                  ModuleManager.init();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openKey.wasPressed()) {
                          client.setScreen(new ClickGuiScreen());
                      }
                      ModuleManager.tick();
                  });

                  HudRenderCallback.EVENT.register((ctx, tickDelta) -> ModuleManager.render(ctx));
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/gui
          cat > src/main/java/com/bob/visual/gui/ClickGuiScreen.java <<'EOF_FILE'
          package com.bob.visual.gui;

          import com.bob.visual.module.Module;
          import com.bob.visual.module.ModuleManager;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class ClickGuiScreen extends Screen {
              private static final int PX = 10, PY = 12, W = 100, GAP = 6, HEAD = 16, ROW = 14;

              private double scroll = 0;

              public ClickGuiScreen() { super(Text.literal("Visual")); }

              @Override public boolean shouldPause() { return false; }

              private static String title(Module.Category c) {
                  return switch (c) {
                      case INFO -> "Info";
                      case HUD -> "HUD";
                      case VISUAL -> "Visual";
                      case MISC -> "Misc";
                  };
              }

              private static int count(Module.Category c) {
                  int n = 0;
                  for (Module m : ModuleManager.MODULES) if (m.category == c) n++;
                  return n;
              }

              private int maxHeight() {
                  int max = 0;
                  for (Module.Category c : Module.Category.values()) max = Math.max(max, count(c));
                  return PY + HEAD + max * ROW + 10;
              }

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  int sy = (int) scroll;
                  int i = 0;
                  for (Module.Category c : Module.Category.values()) {
                      int px = PX + i * (W + GAP);
                      ctx.fill(px, PY + sy, px + W, PY + sy + HEAD, 0xFF6A3DE8);
                      ctx.drawTextWithShadow(textRenderer, title(c), px + 6, PY + sy + 4, 0xFFFFFF);
                      int y = PY + sy + HEAD;
                      for (Module m : ModuleManager.MODULES) {
                          if (m.category != c) continue;
                          boolean hover = mouseX >= px && mouseX < px + W && mouseY >= y && mouseY < y + ROW;
                          int bg = m.enabled ? 0xFF3B2A7A : (hover ? 0xE0303030 : 0xE0181818);
                          ctx.fill(px, y, px + W, y + ROW, bg);
                          ctx.drawTextWithShadow(textRenderer, m.name, px + 6, y + 3,
                                  m.enabled ? 0xFFFFFF : 0xAAAAAA);
                          y += ROW;
                      }
                      i++;
                  }
                  super.render(ctx, mouseX, mouseY, delta);
              }

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  if (button == 0) {
                      int sy = (int) scroll;
                      int i = 0;
                      for (Module.Category c : Module.Category.values()) {
                          int px = PX + i * (W + GAP);
                          int y = PY + sy + HEAD;
                          for (Module m : ModuleManager.MODULES) {
                              if (m.category != c) continue;
                              if (mx >= px && mx < px + W && my >= y && my < y + ROW) {
                                  m.toggle();
                                  return true;
                              }
                              y += ROW;
                          }
                          i++;
                      }
                  }
                  return super.mouseClicked(mx, my, button);
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double amount) {
                  double min = Math.min(0, height - maxHeight());
                  scroll = Math.max(min, Math.min(0, scroll + amount * ROW * 2));
                  return true;
              }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (keyCode == GLFW.GLFW_KEY_RIGHT_SHIFT) { close(); return true; }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/module
          cat > src/main/java/com/bob/visual/module/Module.java <<'EOF_FILE'
          package com.bob.visual.module;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;

          import java.util.List;

          public abstract class Module {
              public enum Category { INFO, HUD, VISUAL, MISC }

              protected static final MinecraftClient mc = MinecraftClient.getInstance();

              public final String name;
              public final Category category;
              public boolean enabled;

              protected Module(String name, Category category) {
                  this.name = name;
                  this.category = category;
              }

              /** Включить по умолчанию (без вызова onEnable). */
              public Module on() {
                  enabled = true;
                  return this;
              }

              public void toggle() {
                  enabled = !enabled;
                  if (enabled) onEnable(); else onDisable();
              }

              /** Одна строка текста для левого списка. null = ничего не показывать. */
              public String info() { return null; }

              /** Несколько строк для левого списка. */
              public List<String> lines() {
                  String s = info();
                  return s == null ? null : List.of(s);
              }

              public void onEnable() {}
              public void onDisable() {}
              public void onTick() {}
              public void onRender(DrawContext ctx, int w, int h) {}
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/module
          cat > src/main/java/com/bob/visual/module/ModuleManager.java <<'EOF_FILE'
          package com.bob.visual.module;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.util.math.MathHelper;

          import java.util.ArrayList;
          import java.util.List;

          public class ModuleManager {
              public static final List<Module> MODULES = new ArrayList<>();
              public static boolean rainbow = false;

              public static void init() {
                  // INFO (текст слева)
                  MODULES.add(new Modules.FpsHud().on());
                  MODULES.add(new Modules.PingHud());
                  MODULES.add(new Modules.CoordsHud().on());
                  MODULES.add(new Modules.NetherCoords());
                  MODULES.add(new Modules.DirectionHud());
                  MODULES.add(new Modules.RotationHud());
                  MODULES.add(new Modules.SpeedHud());
                  MODULES.add(new Modules.CpsHud().on());
                  MODULES.add(new Modules.ClockHud());
                  MODULES.add(new Modules.SessionHud());
                  MODULES.add(new Modules.MemoryHud());
                  MODULES.add(new Modules.BiomeHud());
                  MODULES.add(new Modules.LightHud());
                  MODULES.add(new Modules.DayHud());
                  MODULES.add(new Modules.ServerHud());
                  MODULES.add(new Modules.HealthHud());
                  MODULES.add(new Modules.HungerHud());
                  MODULES.add(new Modules.XpHud());
                  MODULES.add(new Modules.HeldItemHud());
                  MODULES.add(new Modules.PotionHud().on());
                  MODULES.add(new Modules.DateHud());
                  MODULES.add(new Modules.MoonHud());
                  MODULES.add(new Modules.PlayersHud());
                  MODULES.add(new Modules.BlockInfo());
                  MODULES.add(new Modules.FreeSlots());
                  MODULES.add(new Modules.Cooldowns());
                  MODULES.add(new Modules.TargetName());
                  MODULES.add(new Modules.EntityCount());
                  MODULES.add(new Modules.ChunkHud());
                  MODULES.add(new Modules.DimensionHud());
                  MODULES.add(new Modules.GamemodeHud());
                  MODULES.add(new Modules.FallHud());
                  MODULES.add(new Modules.AirHud());
                  MODULES.add(new Modules.ArmorValueHud());
                  MODULES.add(new Modules.AttackCooldownHud());
                  MODULES.add(new Modules.WeatherHud());
                  MODULES.add(new Modules.ResolutionHud());
                  MODULES.add(new Modules.MovementHud());
                  // HUD (элементы)
                  MODULES.add(new Modules.Keystrokes().on());
                  MODULES.add(new Modules.ArmorHud().on());
                  MODULES.add(new Modules.ItemCounter());
                  MODULES.add(new Modules.TargetHud());
                  MODULES.add(new Modules.InventoryHud());
                  MODULES.add(new Modules.CenterDot());
                  MODULES.add(new Modules.LowHpWarning());
                  MODULES.add(new Modules.DurabilityWarning());
                  MODULES.add(new Modules.CustomCrosshair());
                  MODULES.add(new Modules.OffhandHud());
                  MODULES.add(new Modules.HealthBar());
                  MODULES.add(new Modules.Compass());
                  MODULES.add(new Modules.FpsGraph());
                  // VISUAL
                  MODULES.add(new Modules.Watermark().on());
                  MODULES.add(new Modules.ArrayListHud().on());
                  MODULES.add(new Modules.Rainbow());
                  MODULES.add(new Modules.Fullbright());
                  MODULES.add(new Modules.Zoom());
                  MODULES.add(new Modules.WideFov());
                  MODULES.add(new Modules.AlwaysDay());
                  MODULES.add(new Modules.AlwaysNight());
                  MODULES.add(new Modules.NoRain());
                  MODULES.add(new Modules.Hitboxes());
                  MODULES.add(new Modules.MinimalParticles());
                  MODULES.add(new Modules.NoClouds());
                  MODULES.add(new Modules.NoBobbing());
                  MODULES.add(new Modules.NoShadows());
                  MODULES.add(new Modules.StaticFov());
                  MODULES.add(new Modules.ClearChat());
                  MODULES.add(new Modules.FastGraphics());
                  MODULES.add(new Modules.UnlimitedFps());
                  MODULES.add(new Modules.VsyncOff());
                  // MISC
                  MODULES.add(new Modules.ToggleSprint());
                  MODULES.add(new Modules.ToggleSneak());
                  MODULES.add(new Modules.AutoRespawn());
                  MODULES.add(new Modules.AutoJumpOff());
                  MODULES.add(new Modules.MuteMusic());
              }

              /** Выключает все модули данного класса (с вызовом onDisable). */
              public static void off(Class<? extends Module> c) {
                  for (Module m : MODULES) {
                      if (c.isInstance(m) && m.enabled) m.toggle();
                  }
              }

              public static int color(int i) {
                  if (!rainbow) return 0xFFFFFF;
                  float hue = ((System.currentTimeMillis() % 4000L) / 4000f + i * 0.04f) % 1f;
                  return MathHelper.hsvToRgb(hue, 0.6f, 1f) | 0xFF000000;
              }

              public static void tick() {
                  for (Module m : MODULES) if (m.enabled) m.onTick();
              }

              public static void render(DrawContext ctx) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.player == null || mc.world == null || mc.options.hudHidden) return;
                  int w = mc.getWindow().getScaledWidth();
                  int h = mc.getWindow().getScaledHeight();

                  int line = 0;
                  for (Module m : MODULES) {
                      if (!m.enabled) continue;
                      List<String> ls = m.lines();
                      if (ls == null) continue;
                      for (String s : ls) {
                          ctx.drawTextWithShadow(mc.textRenderer, s, 4, 4 + line * 11, color(line));
                          line++;
                      }
                  }
                  for (Module m : MODULES) if (m.enabled) m.onRender(ctx, w, h);
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/module
          cat > src/main/java/com/bob/visual/module/Modules.java <<'EOF_FILE'
          package com.bob.visual.module;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.DeathScreen;
          import net.minecraft.client.network.PlayerListEntry;
          import net.minecraft.client.option.CloudRenderMode;
          import net.minecraft.client.option.GraphicsMode;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.option.ParticlesMode;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.hit.HitResult;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.world.World;

          import java.time.LocalDate;
          import java.time.LocalTime;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Deque;
          import java.util.List;

          public final class Modules {
              private Modules() {}

              private static final long START = System.currentTimeMillis();

              // ============================ INFO ============================

              public static class FpsHud extends Module {
                  public FpsHud() { super("FPS", Category.INFO); }
                  @Override public String info() { return "FPS: " + mc.getCurrentFps(); }
              }

              public static class PingHud extends Module {
                  public PingHud() { super("Ping", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null || mc.getNetworkHandler() == null) return null;
                      PlayerListEntry e = mc.getNetworkHandler().getPlayerListEntry(mc.player.getUuid());
                      return "Ping: " + (e == null ? 0 : e.getLatency()) + " ms";
                  }
              }

              public static class CoordsHud extends Module {
                  public CoordsHud() { super("Coordinates", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      return String.format("XYZ: %.1f / %.1f / %.1f",
                              mc.player.getX(), mc.player.getY(), mc.player.getZ());
                  }
              }

              public static class NetherCoords extends Module {
                  public NetherCoords() { super("Nether Coords", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null || mc.world == null) return null;
                      boolean nether = mc.world.getRegistryKey() == World.NETHER;
                      double f = nether ? 8.0 : 0.125;
                      return String.format("%s: %.1f / %.1f", nether ? "Overworld" : "Nether",
                              mc.player.getX() * f, mc.player.getZ() * f);
                  }
              }

              public static class DirectionHud extends Module {
                  public DirectionHud() { super("Direction", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      return "Facing: " + mc.player.getHorizontalFacing().asString();
                  }
              }

              public static class RotationHud extends Module {
                  public RotationHud() { super("Rotation", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      return String.format("Yaw: %.1f  Pitch: %.1f",
                              MathHelper.wrapDegrees(mc.player.getYaw()), mc.player.getPitch());
                  }
              }

              public static class SpeedHud extends Module {
                  private double px, pz, bps;
                  public SpeedHud() { super("Speed", Category.INFO); }
                  @Override public void onTick() {
                      if (mc.player == null) return;
                      double dx = mc.player.getX() - px;
                      double dz = mc.player.getZ() - pz;
                      bps = bps * 0.8 + Math.hypot(dx, dz) * 20.0 * 0.2;
                      px = mc.player.getX();
                      pz = mc.player.getZ();
                  }
                  @Override public String info() { return String.format("Speed: %.1f b/s", bps); }
              }

              /** CPS считается по тикам, поэтому приблизительно. */
              public static class CpsHud extends Module {
                  private final Deque<Long> left = new ArrayDeque<>();
                  private final Deque<Long> right = new ArrayDeque<>();
                  private boolean lastL, lastR;

                  public CpsHud() { super("CPS", Category.INFO); }

                  @Override public void onTick() {
                      long now = System.currentTimeMillis();
                      boolean l = mc.options.attackKey.isPressed();
                      boolean r = mc.options.useKey.isPressed();
                      if (l && !lastL) left.add(now);
                      if (r && !lastR) right.add(now);
                      lastL = l;
                      lastR = r;
                      while (!left.isEmpty() && now - left.peekFirst() > 1000) left.pollFirst();
                      while (!right.isEmpty() && now - right.peekFirst() > 1000) right.pollFirst();
                  }

                  @Override public String info() { return "CPS: " + left.size() + " | " + right.size(); }
              }

              public static class ClockHud extends Module {
                  private static final DateTimeFormatter FMT = DateTimeFormatter.ofPattern("HH:mm:ss");
                  public ClockHud() { super("Clock", Category.INFO); }
                  @Override public String info() { return "Time: " + LocalTime.now().format(FMT); }
              }

              public static class SessionHud extends Module {
                  public SessionHud() { super("Session", Category.INFO); }
                  @Override public String info() {
                      long s = (System.currentTimeMillis() - START) / 1000L;
                      return String.format("Session: %d:%02d:%02d", s / 3600, (s / 60) % 60, s % 60);
                  }
              }

              public static class MemoryHud extends Module {
                  public MemoryHud() { super("Memory", Category.INFO); }
                  @Override public String info() {
                      Runtime rt = Runtime.getRuntime();
                      long used = (rt.totalMemory() - rt.freeMemory()) / 1048576L;
                      long max = rt.maxMemory() / 1048576L;
                      return "RAM: " + used + " / " + max + " MB";
                  }
              }

              public static class BiomeHud extends Module {
                  public BiomeHud() { super("Biome", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null || mc.world == null) return null;
                      String b = mc.world.getBiome(mc.player.getBlockPos())
                              .getKey().map(k -> k.getValue().getPath()).orElse("unknown");
                      return "Biome: " + b;
                  }
              }

              public static class LightHud extends Module {
                  public LightHud() { super("Light", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null || mc.world == null) return null;
                      return "Light: " + mc.world.getLightLevel(mc.player.getBlockPos());
                  }
              }

              public static class DayHud extends Module {
                  public DayHud() { super("Day", Category.INFO); }
                  @Override public String info() {
                      if (mc.world == null) return null;
                      return "Day: " + (mc.world.getTimeOfDay() / 24000L);
                  }
              }

              public static class ServerHud extends Module {
                  public ServerHud() { super("Server", Category.INFO); }
                  @Override public String info() {
                      if (mc.getCurrentServerEntry() == null) return "Server: singleplayer";
                      return "Server: " + mc.getCurrentServerEntry().address;
                  }
              }

              public static class HealthHud extends Module {
                  public HealthHud() { super("Health", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      float abs = mc.player.getAbsorptionAmount();
                      return String.format("HP: %.1f", mc.player.getHealth())
                              + (abs > 0 ? String.format(" (+%.1f)", abs) : "");
                  }
              }

              public static class HungerHud extends Module {
                  public HungerHud() { super("Hunger", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      return String.format("Food: %d  Sat: %.1f",
                              mc.player.getHungerManager().getFoodLevel(),
                              mc.player.getHungerManager().getSaturationLevel());
                  }
              }

              public static class XpHud extends Module {
                  public XpHud() { super("XP", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      return "XP level: " + mc.player.experienceLevel;
                  }
              }

              public static class HeldItemHud extends Module {
                  public HeldItemHud() { super("Held Item", Category.INFO); }
                  @Override public String info() {
                      if (mc.player == null) return null;
                      ItemStack s = mc.player.getMainHandStack();
                      if (s.isEmpty()) return null;
                      String t = s.getName().getString();
                      if (s.isDamageable()) t += " " + (s.getMaxDamage() - s.getDamage()) + "/" + s.getMaxDamage();
                      else if (s.getCount() > 1) t += " x" + s.getCount();
                      return t;
                  }
              }

              public static class PotionHud extends Module {
                  public PotionHud() { super("Potion HUD", Category.INFO); }
                  @Override public List<String> lines() {
                      if (mc.player == null) return null;
                      List<String> out = new ArrayList<>();
                      for (StatusEffectInstance e : mc.player.getStatusEffects()) {
                          int sec = e.getDuration() / 20;
                          String time = e.getDuration() < 0 ? "inf" : String.format("%d:%02d", sec / 60, sec % 60);
                          out.add(e.getEffectType().getName().getString() + " " + (e.getAmplifier() + 1) + "  " + time);
                      }
                      return out.isEmpty() ? null : out;
                  }
              }

              // ============================ HUD ============================

              public static class Keystrokes extends Module {
                  public Keystrokes() { super("Keystrokes", Category.HUD); }

                  private void key(DrawContext ctx, String label, KeyBinding kb, int kx, int ky, int w) {
                      boolean down = kb.isPressed();
                      ctx.fill(kx, ky, kx + w, ky + 18, down ? 0xAAFFFFFF : 0x80000000);
                      int tx = kx + (w - mc.textRenderer.getWidth(label)) / 2;
                      ctx.drawText(mc.textRenderer, label, tx, ky + 5, down ? 0x000000 : 0xFFFFFF, false);
                  }

                  @Override public void onRender(DrawContext ctx, int w, int h) {
                      int x = 6, y = h - 70;
                      key(ctx, "W", mc.options.forwardKey, x + 20, y, 18);
                      key(ctx, "A", mc.options.leftKey, x, y + 20, 18);
                      key(ctx, "S", mc.options.backKey, x + 20, y + 20, 18);
                      key(ctx, "D", mc.options.rightKey, x + 40, y + 20, 18);
                      key(ctx, "LMB", mc.options.attackKey, x, y + 40, 29);
                      key(ctx, "RMB", mc.options.useKey, x + 31, y + 40, 29);
                  }
              }

