              public static class ArrayListHud extends Module {
                  public ArrayListHud() { super("ArrayList", Category.VISUAL); }
                  @Override public void onRender(DrawContext ctx, int w, int h) {
                      List<Module> list = new ArrayList<>();
                      for (Module m : ModuleManager.MODULES) {
                          if (m.enabled && m != this && !(m instanceof Watermark)) list.add(m);
                      }
                      list.sort((a, b) -> mc.textRenderer.getWidth(b.name) - mc.textRenderer.getWidth(a.name));
                      for (int i = 0; i < list.size(); i++) {
                          String s = list.get(i).name;
                          int tw = mc.textRenderer.getWidth(s);
                          int y = 4 + i * 11;
                          int c = ModuleManager.color(i);
                          ctx.fill(w - tw - 8, y - 1, w - 2, y + 10, 0x80000000);
                          ctx.fill(w - 2, y - 1, w, y + 10, c | 0xFF000000);
                          ctx.drawTextWithShadow(mc.textRenderer, s, w - tw - 5, y + 1, c);
                      }
