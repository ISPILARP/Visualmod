name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Generate project
        run: |
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'fabric-loom' version '1.5-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
          java {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx1G
          minecraft_version=1.20.1
          yarn_mappings=1.20.1+build.10
          loader_version=0.15.11
          fabric_version=0.92.2+1.20.1
          mod_version=1.0.0
          maven_group=com.bob
          archives_base_name=visualmod
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  maven { url 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual
          cat > src/main/java/com/bob/visual/VisualClient.java <<'EOF_FILE'
          package com.bob.visual;

          import com.bob.visual.gui.ClickGuiScreen;
          import com.bob.visual.module.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class VisualClient implements ClientModInitializer {
              public static KeyBinding openKey;

              @Override
              public void onInitializeClient() {
                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.visual.open", InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT, "category.visual"));

                  ModuleManager.init();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openKey.wasPressed()) {
                          client.setScreen(new ClickGuiScreen());
                      }
                      ModuleManager.tick();
                  });

                  HudRenderCallback.EVENT.register((ctx, tickDelta) -> ModuleManager.render(ctx));
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/gui
          cat > src/main/java/com/bob/visual/gui/ClickGuiScreen.java <<'EOF_FILE'
          package com.bob.visual.gui;

          import com.bob.visual.module.Module;
          import com.bob.visual.module.ModuleManager;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class ClickGuiScreen extends Screen {
              private static final int PX = 20, PY = 20, W = 130, HEAD = 18, ROW = 16;

              public ClickGuiScreen() { super(Text.literal("Visual")); }

              @Override public boolean shouldPause() { return false; }

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  ctx.fill(PX, PY, PX + W, PY + HEAD, 0xFF6A3DE8);
                  ctx.drawTextWithShadow(textRenderer, "Visual", PX + 6, PY + 5, 0xFFFFFF);

                  int y = PY + HEAD;
                  for (Module m : ModuleManager.MODULES) {
                      boolean hover = mouseX >= PX && mouseX < PX + W && mouseY >= y && mouseY < y + ROW;
                      int bg = m.enabled ? 0xFF3B2A7A : (hover ? 0xE0303030 : 0xE0181818);
                      ctx.fill(PX, y, PX + W, y + ROW, bg);
                      ctx.drawTextWithShadow(textRenderer, m.name, PX + 6, y + 4,
                              m.enabled ? 0xFFFFFF : 0xAAAAAA);
                      y += ROW;
                  }
                  super.render(ctx, mouseX, mouseY, delta);
              }

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  int y = PY + HEAD;
                  for (Module m : ModuleManager.MODULES) {
                      if (mx >= PX && mx < PX + W && my >= y && my < y + ROW && button == 0) {
                          m.toggle();
                          return true;
                      }
                      y += ROW;
                  }
                  return super.mouseClicked(mx, my, button);
              }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (keyCode == GLFW.GLFW_KEY_RIGHT_SHIFT) { close(); return true; }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/module
          cat > src/main/java/com/bob/visual/module/Module.java <<'EOF_FILE'
          package com.bob.visual.module;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;

          public abstract class Module {
              protected static final MinecraftClient mc = MinecraftClient.getInstance();

              public final String name;
              public boolean enabled;
              public int x, y; // позиция на экране для HUD-модулей

              protected Module(String name, int x, int y) {
                  this.name = name;
                  this.x = x;
                  this.y = y;
              }

              public void toggle() {
                  enabled = !enabled;
                  if (enabled) onEnable(); else onDisable();
              }

              public void onEnable() {}
              public void onDisable() {}
              public void onTick() {}
              public void onRender(DrawContext ctx) {}
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/module
          cat > src/main/java/com/bob/visual/module/ModuleManager.java <<'EOF_FILE'
          package com.bob.visual.module;

          import net.minecraft.client.gui.DrawContext;

          import java.util.ArrayList;
          import java.util.List;

          public class ModuleManager {
              public static final List<Module> MODULES = new ArrayList<>();

              public static void init() {
                  MODULES.add(new Modules.FpsHud());
                  MODULES.add(new Modules.CoordsHud());
                  MODULES.add(new Modules.CpsHud());
                  MODULES.add(new Modules.Keystrokes());
                  MODULES.add(new Modules.ArmorHud());
                  MODULES.add(new Modules.Fullbright());
                  MODULES.add(new Modules.Zoom());
              }

              public static void tick() {
                  for (Module m : MODULES) if (m.enabled) m.onTick();
              }

              public static void render(DrawContext ctx) {
                  for (Module m : MODULES) if (m.enabled) m.onRender(ctx);
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/bob/visual/module
          cat > src/main/java/com/bob/visual/module/Modules.java <<'EOF_FILE'
          package com.bob.visual.module;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.item.ItemStack;

          import java.util.ArrayDeque;
          import java.util.Deque;

          public final class Modules {
              private Modules() {}

              /** FPS */
              public static class FpsHud extends Module {
                  public FpsHud() { super("FPS", 4, 4); }
                  @Override public void onRender(DrawContext ctx) {
                      ctx.drawTextWithShadow(mc.textRenderer, "FPS: " + mc.getCurrentFps(), x, y, 0xFFFFFF);
                  }
              }

              /** Координаты */
              public static class CoordsHud extends Module {
                  public CoordsHud() { super("Coordinates", 4, 16); }
                  @Override public void onRender(DrawContext ctx) {
                      if (mc.player == null) return;
                      String s = String.format("XYZ: %.1f / %.1f / %.1f",
                              mc.player.getX(), mc.player.getY(), mc.player.getZ());
                      ctx.drawTextWithShadow(mc.textRenderer, s, x, y, 0xFFFFFF);
                  }
              }

              /** CPS (считается по тикам, поэтому приблизительно) */
              public static class CpsHud extends Module {
                  private final Deque<Long> left = new ArrayDeque<>();
                  private final Deque<Long> right = new ArrayDeque<>();
                  private boolean lastL, lastR;

                  public CpsHud() { super("CPS", 4, 28); }

                  @Override public void onTick() {
                      long now = System.currentTimeMillis();
                      boolean l = mc.options.attackKey.isPressed();
                      boolean r = mc.options.useKey.isPressed();
                      if (l && !lastL) left.add(now);
                      if (r && !lastR) right.add(now);
                      lastL = l; lastR = r;
                      while (!left.isEmpty() && now - left.peekFirst() > 1000) left.pollFirst();
                      while (!right.isEmpty() && now - right.peekFirst() > 1000) right.pollFirst();
                  }

                  @Override public void onRender(DrawContext ctx) {
                      ctx.drawTextWithShadow(mc.textRenderer,
                              "CPS: " + left.size() + " | " + right.size(), x, y, 0xFFFFFF);
                  }
              }

              /** WASD + мышь */
              public static class Keystrokes extends Module {
                  public Keystrokes() { super("Keystrokes", 40, 60); }

                  private void key(DrawContext ctx, String label, KeyBinding kb, int kx, int ky, int w) {
                      boolean down = kb.isPressed();
                      ctx.fill(kx, ky, kx + w, ky + 18, down ? 0xAAFFFFFF : 0x80000000);
                      int tx = kx + (w - mc.textRenderer.getWidth(label)) / 2;
                      ctx.drawText(mc.textRenderer, label, tx, ky + 5, down ? 0x000000 : 0xFFFFFF, false);
                  }

                  @Override public void onRender(DrawContext ctx) {
                      key(ctx, "W", mc.options.forwardKey, x + 20, y, 18);
                      key(ctx, "A", mc.options.leftKey, x, y + 20, 18);
                      key(ctx, "S", mc.options.backKey, x + 20, y + 20, 18);
                      key(ctx, "D", mc.options.rightKey, x + 40, y + 20, 18);
                      key(ctx, "LMB", mc.options.attackKey, x, y + 40, 29);
                      key(ctx, "RMB", mc.options.useKey, x + 31, y + 40, 29);
                  }
              }

              /** Броня на экране */
              public static class ArmorHud extends Module {
                  public ArmorHud() { super("Armor HUD", 4, 90); }
                  @Override public void onRender(DrawContext ctx) {
                      if (mc.player == null) return;
                      int i = 0;
                      for (int slot = 3; slot >= 0; slot--) {
                          ItemStack s = mc.player.getInventory().armor.get(slot);
                          if (s.isEmpty()) continue;
                          ctx.drawItem(s, x, y + i * 18);
                          ctx.drawItemInSlot(mc.textRenderer, s, x, y + i * 18);
                          i++;
                      }
                  }
              }

              /** Яркость (ночное зрение, только на клиенте) */
              public static class Fullbright extends Module {
                  public Fullbright() { super("Fullbright", 0, 0); }
                  @Override public void onTick() {
                      if (mc.player == null) return;
                      mc.player.addStatusEffect(new StatusEffectInstance(
                              StatusEffects.NIGHT_VISION, 400, 0, false, false, false));
                  }
                  @Override public void onDisable() {
                      if (mc.player != null) mc.player.removeStatusEffect(StatusEffects.NIGHT_VISION);
                  }
              }

              /** Зум через FOV */
              public static class Zoom extends Module {
                  private int oldFov = 70;
                  public Zoom() { super("Zoom", 0, 0); }
                  @Override public void onEnable() {
                      oldFov = mc.options.getFov().getValue();
                      mc.options.getFov().setValue(30);
                  }
                  @Override public void onDisable() {
                      mc.options.getFov().setValue(oldFov);
                  }
              }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/visualmod/lang
          cat > src/main/resources/assets/visualmod/lang/en_us.json <<'EOF_FILE'
          {
            "key.visual.open": "Open Visual menu",
            "category.visual": "Visual Mod"
          }
          EOF_FILE
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EOF_FILE'
          {
            "schemaVersion": 1,
            "id": "visualmod",
            "version": "${version}",
            "name": "Visual Mod",
            "description": "HUD и визуальные функции. Меню на Right Shift.",
            "environment": "client",
            "entrypoints": {
              "client": ["com.bob.visual.VisualClient"]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.20.1",
              "java": ">=17",
              "fabric-api": "*"
            }
          }
          EOF_FILE
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: visualmod
          path: build/libs/*.jar
